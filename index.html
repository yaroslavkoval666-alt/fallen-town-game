<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fallen Town: MMORPG Server Edition</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #03050a;
            --card-bg: #080d1a;
            --accent-color: #00ffcc;
            --danger-color: #ff2a5f;
            --warning-color: #ffb700;
            --text-color: #f1f5f9;
            --text-muted: #64748b;
            --border-color: #1e293b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 8px; padding-bottom: 80px; }
        .header { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 10px 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .user-info h3 { color: var(--accent-color); font-size: 14px; font-weight: 700; }
        .stats-bar { margin-top: 3px; font-size: 10px; color: var(--text-muted); }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
        .card h4 { font-size: 13px; margin-bottom: 6px; }
        .bar-container { width: 100%; background: #020408; border-radius: 6px; height: 9px; margin: 3px 0; overflow: hidden; border: 1px solid var(--border-color); }
        .bar-fill { height: 100%; transition: width 0.3s ease; }
        .hp-bar { background: var(--danger-color); }
        .energy-bar { background: var(--warning-color); }
        .exp-bar { background: var(--accent-color); }
        .btn { background: #111827; color: var(--accent-color); border: 1px solid var(--accent-color); padding: 10px 12px; border-radius: 8px; width: 100%; font-weight: 700; font-size: 12px; cursor: pointer; margin-top: 8px; }
        .btn:active { transform: scale(0.97); background: var(--accent-color); color: #000; }
        .btn-danger { color: var(--danger-color); border-color: var(--danger-color); }
        .btn-warning { color: var(--warning-color); border-color: var(--warning-color); }
        .nav-tabs { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(8, 13, 26, 0.95); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; padding: 8px 0; z-index: 50; }
        .tab-btn { background: none; border: none; color: var(--text-muted); font-size: 9px; display: flex; flex-direction: column; align-items: center; cursor: pointer; gap: 3px; font-weight: 600; }
        .tab-btn.active { color: var(--accent-color); }
        .zone-card { background: #050a14; border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; margin-bottom: 8px; font-size: 11px; }
        .zone-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .combat-log { background: #020408; border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; height: 100px; overflow-y: auto; font-size: 11px; margin-top: 8px; font-family: monospace; color: #38bdf8; }
        .input-box { width: 100%; padding: 10px; margin: 6px 0 12px 0; background: #03050a; border: 1px solid var(--border-color); color: #fff; border-radius: 8px; font-size: 12px; outline: none; }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-info">
            <h3 id="pName">Загрузка...</h3>
            <div class="stats-bar">Ур: <b id="pLvl">1</b> | 💰 <b id="pGold">0</b> | 🏆 <b id="pPvp">1000</b></div>
        </div>
    </div>

    <div class="card">
        <div style="font-size: 10px; display:flex; justify-content:space-between;"><span>Здоровье (HP):</span> <b id="hpTxt">0/0</b></div>
        <div class="bar-container"><div id="hpFill" class="bar-fill hp-bar"></div></div>
        <div style="font-size: 10px; display:flex; justify-content:space-between; margin-top: 4px;"><span>Энергия:</span> <b id="energyTxt">0/0</b></div>
        <div class="bar-container"><div id="energyFill" class="bar-fill energy-bar"></div></div>
        <div style="font-size: 10px; display:flex; justify-content:space-between; margin-top: 4px;"><span>Опыт (EXP):</span> <b id="expTxt">0/0</b></div>
        <div class="bar-container"><div id="expFill" class="bar-fill exp-bar"></div></div>
    </div>

    <!-- ВКЛАДКА 1: КАРТА -->
    <div id="tab-main" class="tab-content">
        <div class="card">
            <h4 style="color: var(--accent-color);">🗺️ СЕКТОРЫ ПУСТОШЕЙ</h4>
            <div class="zone-card">
                <div class="zone-header"><b style="color:#00ffcc">1. Окраины Пустоши</b></div>
                <button class="btn" onclick="apiSectorBattle(1)">Штурмовать [Энергия: 10]</button>
            </div>
            <div class="zone-card">
                <div class="zone-header"><b style="color:#ffaa00">2. Завод Х-18</b></div>
                <button class="btn btn-warning" onclick="apiSectorBattle(2)">Штурмовать [Энергия: 18]</button>
            </div>
            <div class="zone-card">
                <div class="zone-header"><b style="color:#ff2a5f">3. Бункер Омега</b></div>
                <button class="btn btn-danger" onclick="apiSectorBattle(3)">Штурмовать [Энергия: 28]</button>
            </div>
        </div>
        <div class="card">
            <h4 style="color: var(--warning-color);">📜 БОЕВОЙ ЛОГ СЕРВЕРА</h4>
            <div class="combat-log" id="combatLog">Связь с сервером установлена...</div>
        </div>
    </div>

    <!-- ВКЛАДКА 2: ГОРОД И ЛАБОРАТОРИЯ -->
    <div id="tab-city" class="tab-content" style="display:none;">
        <div class="card">
            <h4 style="color: var(--accent-color);">🧬 КВАНТОВАЯ ЛАБОРАТОРИЯ</h4>
            <button class="btn" onclick="apiBuyMutation(1)">Улучшить ДНК Хищника [30 Чипов, 200 💰]</button>
            <button class="btn btn-warning" onclick="apiBuyMutation(2)" style="margin-top:6px;">Улучшить Нано-Броню [40 Чипов, 300 💰]</button>
        </div>
        <div class="card">
            <h4 style="color: var(--warning-color);">🏰 СИНДИКАТЫ</h4>
            <input type="text" id="clanInput" class="input-box" placeholder="Название клана...">
            <button class="btn" onclick="apiCreateClan()">Основать клан [300 💰]</button>
        </div>
    </div>

    <!-- ВКЛАДКА 3: PvP -->
    <div id="tab-pvp" class="tab-content" style="display:none;">
        <div class="card">
            <h4 style="color: var(--danger-color);">⚔️ PvP АРЕНА</h4>
            <button class="btn btn-danger" onclick="apiPvpDuel()">🥊 Начать дуэль [-20 Энергии]</button>
        </div>
    </div>

    <!-- НАВИГАЦИЯ -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="openTab('main')" id="navMain">🗺️ Карта</button>
        <button class="tab-btn" onclick="openTab('city')" id="navCity">🏰 Город</button>
        <button class="tab-btn" onclick="openTab('pvp')" id="navPvp">⚔️ PvP</button>
    </div>

<script>
    // ПРИМЕЧАНИЕ: После деплоя на Render измени локальный URL на адрес твоего бэкенда!
    const API_URL = "https://fallen-666-town.onrender.com/api";
    let username = "@mn666rs";

    async function initGame() {
        try {
            let res = await fetch(`${API_URL}/player/init`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username })
            });
            let data = await res.json();
            if (data.success) { updateUI(data.player); }
        } catch (e) {
            console.error("Ошибка связи с сервером:", e);
            document.getElementById('combatLog.innerHTML').innerText = "❌ Нет связи с сервером Node.js!";
        }
    }

    function updateUI(p) {
        document.getElementById('pName').innerText = p.username;
        document.getElementById('pLvl').innerText = p.lvl;
        document.getElementById('pGold').innerText = p.gold;
        document.getElementById('pPvp').innerText = p.pvpRating;

        document.getElementById('hpTxt').innerText = `${p.hp}/${p.maxHp}`;
        document.getElementById('hpFill').style.width = `${(p.hp / p.maxHp) * 100}%`;
        document.getElementById('energyTxt').innerText = `${p.energy}/${p.maxEnergy}`;
        document.getElementById('energyFill').style.width = `${(p.energy / p.maxEnergy) * 100}%`;
        document.getElementById('expTxt').innerText = `${p.exp}/${p.maxExp}`;
        document.getElementById('expFill').style.width = `${(p.exp / p.maxExp) * 100}%`;
    }

    async function apiSectorBattle(sectorId) {
        try {
            let res = await fetch(`${API_URL}/battle/sector`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, sectorId })
            });
            let data = await res.json();
            if (data.success) {
                updateUI(data.player);
                logCombat(data.log.join('<br>'));
            } else { alert(data.error); }
        } catch (e) { alert("Ошибка штурма секторов"); }
    }

    async function apiBuyMutation(mutationType) {
        try {
            let res = await fetch(`${API_URL}/lab/buy-mutation`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, mutationType })
            });
            let data = await res.json();
            if (data.success) {
                updateUI(data.player);
                alert(data.message);
            } else { alert(data.error); }
        } catch (e) { alert("Ошибка лаборатории"); }
    }

    async function apiCreateClan() {
        let clanName = document.getElementById('clanInput').value.trim();
        if (!clanName) return;
        try {
            let res = await fetch(`${API_URL}/syndicate/create`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, clanName })
            });
            let data = await res.json();
            if (data.success) { alert(data.message); } else { alert(data.error); }
        } catch (e) { alert("Ошибка создания клана"); }
    }

    async function apiPvpDuel() {
        try {
            let res = await fetch(`${API_URL}/pvp/duel`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username })
            });
            let data = await res.json();
            if (data.success) {
                updateUI(data.attacker);
                logCombat(data.log.join('<br>'));
            } else { alert(data.error); }
        } catch (e) { alert("Ошибка PvP"); }
    }

    function logCombat(text) {
        let log = document.getElementById('combatLog');
        log.innerHTML = `> ${text}<br>` + log.innerHTML;
    }

    function openTab(tabName) {
        ['main', 'city', 'pvp'].forEach(t => {
            document.getElementById(`tab-${t}`).style.display = (t === tabName) ? 'block' : 'none';
        });
        ['navMain', 'navCity', 'navPvp'].forEach(bId => {
            document.getElementById(bId).classList.toggle('active', bId.toLowerCase().includes(tabName));
        });
    }

    window.onload = initGame;
</script>
</body>
</html>
