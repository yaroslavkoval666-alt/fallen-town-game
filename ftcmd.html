<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fallen Town MMORPG</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #161920;
            --accent-color: #00ffcc;
            --danger-color: #ff3366;
            --warning-color: #ffaa00;
            --text-color: #e0e6ed;
            --text-muted: #8a99ad;
            --border-color: #2a2f3d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 10px;
            padding-bottom: 70px;
        }

        .header {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-info h3 {
            color: var(--accent-color);
            font-size: 16px;
        }

        .stats-bar {
            margin-top: 5px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .bar-container {
            width: 100%;
            background: #222;
            border-radius: 5px;
            height: 10px;
            margin: 4px 0;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            transition: width 0.3s ease;
        }

        .hp-bar { background: var(--danger-color); }
        .energy-bar { background: var(--warning-color); }
        .exp-bar { background: var(--accent-color); }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
        }

        .btn {
            background: #222834;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 10px 15px;
            border-radius: 6px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.2s;
        }

        .btn:active {
            transform: scale(0.98);
            background: var(--accent-color);
            color: #000;
        }

        .btn-danger {
            color: var(--danger-color);
            border-color: var(--danger-color);
        }

        .nav-tabs {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .tab-btn.active {
            color: var(--accent-color);
        }

        .lang-switch {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            padding: 20px;
            align-items: center;
            justify-content: center;
        }

        .modal.active { display: flex; }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--accent-color);
            border-radius: 10px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #0d0f12;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <!-- МОДАЛКА РЕГИСТРАЦИИ / ОБУЧЕНИЯ -->
    <div id="regModal" class="modal">
        <div class="modal-content">
            <h2 id="regTitle" style="color: var(--accent-color); text-align: center;">Fallen Town</h2>
            <p id="regDesc" style="margin-top: 10px; font-size: 13px; color: var(--text-muted);"></p>
            <input type="text" id="heroNameInput" placeholder="Имя героя / Hero name">
            <button class="btn" id="startBtn" onclick="registerHero()"></button>
        </div>
    </div>

    <!-- ШАПКА ИГРОКА -->
    <div class="header">
        <div class="user-info">
            <h3 id="pName">Загрузка...</h3>
            <div class="stats-bar">
                <span>Уровень: <b id="pLvl">1</b></span> | 
                <span>Золото: <b id="pGold">0</b></span>
            </div>
        </div>
        <select class="lang-switch" onchange="changeLanguage(this.value)">
            <option value="ua">UA</option>
            <option value="en">EN</option>
        </select>
    </div>

    <!-- ШКАЛЫ (HP / ЭНЕРГИЯ / ОПЫТ) -->
    <div class="card">
        <div style="font-size: 12px;">Здоровье: <span id="hpTxt">0/0</span></div>
        <div class="bar-container"><div id="hpFill" class="bar-fill hp-bar"></div></div>

        <div style="font-size: 12px; margin-top: 5px;">Энергия (+10/мин): <span id="energyTxt">0/0</span></div>
        <div class="bar-container"><div id="energyFill" class="bar-fill energy-bar"></div></div>

        <div style="font-size: 12px; margin-top: 5px;">Опыт: <span id="expTxt">0/0</span></div>
        <div class="bar-container"><div id="expFill" class="bar-fill exp-bar"></div></div>
    </div>

    <!-- ВКЛАДКА: ГЛАВНАЯ / БОЙ -->
    <div id="tab-main" class="tab-content">
        <div class="card">
            <h4 id="locTitle" style="color: var(--accent-color);">Заброшенные Вкраины</h4>
            <p id="locDesc" style="font-size: 12px; color: var(--text-muted); margin: 8px 0;">Дикие земли вокруг руин. Здесь водятся мутанты и налётчики.</p>
            <button class="btn btn-danger" onclick="startBattle()" id="fightBtn">⚔️ Искать противника (-10 Энергии)</button>
        </div>

        <div class="card" id="battleLogCard" style="display:none;">
            <h4 style="color: var(--warning-color);" id="logTitle">Боевой Журнал</h4>
            <div id="battleLog" style="font-size: 12px; margin-top: 8px; max-height: 150px; overflow-y: auto;"></div>
        </div>
    </div>

    <!-- ВКЛАДКА: ПРОФИЛЬ -->
    <div id="tab-profile" class="tab-content" style="display:none;">
        <div class="card">
            <h3 style="color: var(--accent-color);" id="profTitle">Характеристики</h3>
            <p style="font-size: 12px; margin-top: 5px;">Сила: <b id="stStr">10</b></p>
            <p style="font-size: 12px;">Ловкость: <b id="stAgi">10</b></p>
            <p style="font-size: 12px;">Живучесть: <b id="stVit">10</b></p>
            <p style="font-size: 12px; margin-top: 5px; color: var(--warning-color);">Свободные очки: <b id="stFree">0</b></p>
            <button class="btn" style="margin-top: 10px;" onclick="addStat('str')" id="addStrBtn">+1 Сила</button>
            <button class="btn" onclick="addStat('agi')" id="addAgiBtn">+1 Ловкость</button>
            <button class="btn" onclick="addStat('vit')" id="addVitBtn">+1 Живучесть (+10 HP)</button>
        </div>
    </div>

    <!-- НАВИГАЦИЯ -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="openTab('main')" id="navMain">⚔️ Бой</button>
        <button class="tab-btn" onclick="openTab('profile')" id="navProfile">👤 Персонаж</button>
    </div>

<script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) tg.expand();

    // Языковые ресурсы
    const i18n = {
        ua: {
            regTitle: "Павше Місто (Fallen Town)",
            regDesc: "Світ знищено. Залишилися лише руїни та боротьба за виживання. Введи ім'я свого вижившого:",
            startBtn: "Почати виживання",
            fightBtn: "⚔️ Шукати ворога (-10 Енергії)",
            locTitle: "Руїни Селена",
            locDesc: "Небезпечні вулиці, де чатують нападники та мутанти.",
            logTitle: "Журнал бою",
            profTitle: "Характеристики",
            navMain: "⚔️ Бій",
            navProfile: "👤 Профіль",
            noEnergy: "Недостатньо енергії! Зачекай відновлення.",
            lvlUp: "🎉 Новий рівень! Макс. Енергія збільшена на +5! Отримано очки характеристик."
        },
        en: {
            regTitle: "Fallen Town",
            regDesc: "The world is in ruins. Only fight for survival remains. Enter your survivor name:",
            startBtn: "Start Survival",
            fightBtn: "⚔️ Find Enemy (-10 Energy)",
            locTitle: "Ruins of Selene",
            locDesc: "Dangerous streets filled with raiders and mutants.",
            logTitle: "Battle Log",
            profTitle: "Attributes",
            navMain: "⚔️ Battle",
            navProfile: "👤 Profile",
            noEnergy: "Not enough energy! Wait for regeneration.",
            lvlUp: "🎉 Level Up! Max Energy increased by +5! Free stat points granted."
        }
    };

    let lang = 'ua';

    // Структура игрока
    let p = {
        name: "",
        lvl: 1,
        exp: 0,
        maxExp: 100,
        gold: 50,
        hp: 100,
        maxHp: 100,
        energy: 50,
        maxEnergy: 50,
        str: 10,
        agi: 10,
        vit: 10,
        freeStats: 0,
        lastRegen: Date.now()
    };

    function init() {
        let saved = localStorage.getItem('fallen_town_player');
        if (saved) {
            p = JSON.parse(saved);
            document.getElementById('regModal').classList.remove('active');
        } else {
            document.getElementById('regModal').classList.add('active');
        }
        updateLangUI();
        render();
        
        // Таймер пассивной регенерации (+10 энергии раз в 60 сек)
        setInterval(regenTick, 1000);
    }

    function save() {
        localStorage.setItem('fallen_town_player', JSON.stringify(p));
    }

    function changeLanguage(val) {
        lang = val;
        updateLangUI();
    }

    function updateLangUI() {
        let t = i18n[lang];
        document.getElementById('regTitle').innerText = t.regTitle;
        document.getElementById('regDesc').innerText = t.regDesc;
        document.getElementById('startBtn').innerText = t.startBtn;
        document.getElementById('fightBtn').innerText = t.fightBtn;
        document.getElementById('locTitle').innerText = t.locTitle;
        document.getElementById('locDesc').innerText = t.locDesc;
        document.getElementById('logTitle').innerText = t.logTitle;
        document.getElementById('profTitle').innerText = t.profTitle;
        document.getElementById('navMain').innerText = t.navMain;
        document.getElementById('navProfile').innerText = t.navProfile;
    }

    function registerHero() {
        let nameInput = document.getElementById('heroNameInput').value.trim();
        p.name = nameInput || "Survivor";
        document.getElementById('regModal').classList.remove('active');
        save();
        render();
    }

    // Расчёт максимальной энергии по правилу: 1 lvl = +5 к макс. энергии
    function getMaxEnergy() {
        return 50 + (p.lvl - 1) * 5;
    }

    function regenTick() {
        p.maxEnergy = getMaxEnergy();
        let now = Date.now();
        let diff = now - p.lastRegen;

        // Каждые 60 секунд восстанавливаем 10 энергии
        if (diff >= 60000) {
            let intervals = Math.floor(diff / 60000);
            p.energy = Math.min(p.maxEnergy, p.energy + (intervals * 10));
            p.hp = Math.min(p.maxHp, p.hp + (intervals * 5));
            p.lastRegen = now;
            save();
            render();
        }
    }

    function render() {
        p.maxEnergy = getMaxEnergy();
        p.maxHp = 100 + (p.vit - 10) * 10;

        document.getElementById('pName').innerText = p.name || "...";
        document.getElementById('pLvl').innerText = p.lvl;
        document.getElementById('pGold').innerText = p.gold;

        document.getElementById('hpTxt').innerText = `${p.hp}/${p.maxHp}`;
        document.getElementById('hpFill').style.width = `${(p.hp / p.maxHp) * 100}%`;

        document.getElementById('energyTxt').innerText = `${p.energy}/${p.maxEnergy}`;
        document.getElementById('energyFill').style.width = `${(p.energy / p.maxEnergy) * 100}%`;

        document.getElementById('expTxt').innerText = `${p.exp}/${p.maxExp}`;
        document.getElementById('expFill').style.width = `${(p.exp / p.maxExp) * 100}%`;

        document.getElementById('stStr').innerText = p.str;
        document.getElementById('stAgi').innerText = p.agi;
        document.getElementById('stVit').innerText = p.vit;
        document.getElementById('stFree').innerText = p.freeStats;
    }

    function startBattle() {
        if (p.energy < 10) {
            alert(i18n[lang].noEnergy);
            return;
        }

        p.energy -= 10;
        let enemyHp = 30 + p.lvl * 15;
        let enemyDmg = 5 + p.lvl * 3;
        
        let pDmg = p.str * 2 + Math.floor(Math.random() * 5);
        let takenDmg = Math.max(2, enemyDmg - Math.floor(p.agi / 3));

        p.hp = Math.max(0, p.hp - takenDmg);
        
        let rewardGold = 10 + Math.floor(Math.random() * 15);
        let rewardExp = 25 + Math.floor(Math.random() * 15);

        p.gold += rewardGold;
        p.exp += rewardExp;

        let logCard = document.getElementById('battleLogCard');
        let log = document.getElementById('battleLog');
        logCard.style.display = 'block';

        let resText = lang === 'ua' 
            ? `⚔️ <b>Бій завершено!</b><br>Завдано шкоди: ${pDmg} | Отримано шкоди: ${takenDmg}<br>Здобич: +${rewardGold} золота, +${rewardExp} досвіду.`
            : `⚔️ <b>Battle finished!</b><br>Dealt damage: ${pDmg} | Took damage: ${takenDmg}<br>Loot: +${rewardGold} gold, +${rewardExp} EXP.`;
        
        log.innerHTML = resText;

        checkLvlUp();
        save();
        render();
    }

    function checkLvlUp() {
        if (p.exp >= p.maxExp) {
            p.lvl += 1;
            p.exp -= p.maxExp;
            p.maxExp = Math.floor(p.maxExp * 1.5);
            p.freeStats += 3;
            p.maxEnergy = getMaxEnergy();
            p.energy = p.maxEnergy; // Полное восстановление при LvlUp
            p.hp = p.maxHp;
            alert(i18n[lang].lvlUp);
        }
    }

    function addStat(type) {
        if (p.freeStats <= 0) return;
        p.freeStats--;
        if (type === 'str') p.str++;
        if (type === 'agi') p.agi++;
        if (type === 'vit') p.vit++;
        save();
        render();
    }

    function openTab(tabName) {
        document.getElementById('tab-main').style.display = tabName === 'main' ? 'block' : 'none';
        document.getElementById('tab-profile').style.display = tabName === 'profile' ? 'block' : 'none';
        
        document.getElementById('navMain').classList.toggle('active', tabName === 'main');
        document.getElementById('navProfile').classList.toggle('active', tabName === 'profile');
    }

    window.onload = init;
</script>
</body>
</html>
